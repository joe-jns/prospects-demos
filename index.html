<title>Accès protégé</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F6F3EF;--panel:#fff;--ink:#291D17;--muted:#7a6a5e;--line:#e5ddd3}
@media (prefers-color-scheme:dark){
  :root{--bg:#17110d;--panel:#211914;--ink:#f2e9e0;--muted:#a59284;--line:#33261e}}
body{background:var(--bg);color:var(--ink);min-height:100svh;display:grid;place-items:center;
  padding:24px;font:15px/1.55 ui-sans-serif,system-ui,'Segoe UI',sans-serif}
form{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:30px 28px;width:min(100%,380px)}
h1{font-size:19px;margin-bottom:6px;letter-spacing:-.01em}
p{color:var(--muted);font-size:13.5px;margin-bottom:20px}
input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:inherit;font:inherit}
button{width:100%;margin-top:10px;padding:11px;border:0;border-radius:9px;
  background:var(--ink);color:var(--bg);font:inherit;font-weight:600;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
.err{color:#b8722a;font-size:13px;margin-top:12px;min-height:1.2em}
</style></head><body>
<form id="f">
  <h1>Accès protégé</h1>
  <p>Ce document est réservé. Saisissez le mot de passe pour l’ouvrir.</p>
  <input id="p" type="password" autocomplete="current-password" autofocus
         aria-label="Mot de passe">
  <button id="b" type="submit">Ouvrir</button>
  <div class="err" id="e" role="alert"></div>
</form>
